name: Ajustar ventana a 1024x650

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Cambiar altura de ventana
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text(encoding='utf-8')
          old = "width: 1024,\n    height: 700,"
          new = "width: 1024,\n    height: 650,"
          if old not in s:
              raise SystemExit('No se encontró la configuración de ventana principal esperada')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Guardar cambio y eliminar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/set-window-height-650.yml
          git add main.js
          git commit -m "Cambiar ventana principal a 1024x650"
          git push
