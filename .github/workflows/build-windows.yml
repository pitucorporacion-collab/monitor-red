name: Construir Monitor Red Portable para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Construir portable
        run: npm run build:win
      - name: Preparar paquete portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist\Monitor-Red-*-Portable.exe" "package\"
          Copy-Item "data.json" "package\data.json"
      - name: Guardar Portable EXE y data.json
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-Red-Portable
          path: package/*
          if-no-files-found: error
