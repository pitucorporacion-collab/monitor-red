name: Ajustar ventana a 1024x700

on:
  push:
    branches: [main]

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Cambiar tamaño y eliminar workflow temporal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          s = s.replace('width: 1000,\n    height: 605,', 'width: 1024,\n    height: 700,', 1)
          p.write_text(s)
          PY
          rm .github/workflows/set-window-size-1024x700.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/set-window-size-1024x700.yml
          git commit -m "Ajustar ventana inicial a 1024x700"
          git push
