<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1024, height=720, initial-scale=1.0" />
  <title>Monitor de Red</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>MONITOR DE RED</h1>
        <p>Panel de equipos de planta</p>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </header>

    <section id="home" class="view active">
      <div class="cards" id="groupCards"></div>
      <div class="summary">
        <span id="total">0 equipos</span>
        <span>•</span>
        <span>Versión inicial</span>
      </div>
    </section>

    <section id="listView" class="view">
      <div class="listHeader">
        <button class="back" id="backBtn">← VOLVER</button>
        <div>
          <h2 id="listTitle">GRUPO</h2>
          <p id="listSubtitle"></p>
        </div>
        <button class="refresh" id="refreshBtn">↻ ACTUALIZAR</button>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr><th>IP</th><th>NOMBRE</th><th>UBICACIÓN</th><th>ESTADO</th></tr>
          </thead>
          <tbody id="deviceTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
