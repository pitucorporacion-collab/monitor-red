<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor Red RVF Rio Grande</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>MONITOR RED RVF RIO GRANDE</h1>
        <p>Panel de monitoreo de red</p>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </header>

    <section id="home" class="view active">
      <div class="homeControls">
        <div class="summaryBox"><b id="total">0</b><span> IPs</span></div>
        <div class="summaryBox onlineBox"><b id="onlineTotal">0</b><span> ONLINE</span></div>
        <div class="summaryBox offlineBox"><b id="offlineTotal">0</b><span> OFFLINE</span></div>
        <div class="lastCheck" id="lastCheck">Último chequeo: —</div>
        <button class="smallAction" id="onlyProblemsBtn">🔴 SOLO PROBLEMAS</button>
        <div class="homeExtraActions">
          <span class="toolsLabel">HERRAMIENTAS</span>
          <div class="toolsButtons">
            <button class="smallAction rfidAction" id="rfidPageBtn">RFIDPAGE</button>
            <button class="smallAction rackAction" id="racksBtn">RACKS</button>
          </div>
        </div>
      </div>
      <div class="cards" id="groupCards"></div>
    </section>

    <section id="listView" class="view">
      <div class="listHeader">
        <button class="back" id="backBtn">← VOLVER</button>
        <div>
          <h2 id="listTitle">GRUPO</h2>
          <p id="listSubtitle"></p>
        </div>
        <div class="listActions">
          <button class="refresh" id="refreshBtn">↻ ACTUALIZAR</button>
          <button class="addRow" id="addRowBtn">＋ AGREGAR FILA</button>
          <button class="saveBtn" id="saveBtn">💾 GUARDAR</button>
        </div>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th data-sort="ip">IP <span class="sortMark"></span></th>
              <th data-sort="name">NOMBRE <span class="sortMark"></span></th>
              <th data-sort="location">UBICACIÓN <span class="sortMark"></span></th>
              <th data-sort="status">ESTADO <span class="sortMark"></span></th>
            </tr>
          </thead>
          <tbody id="deviceTable"></tbody>
        </table>
      </div>
    </section>

    <section id="racksView" class="view racksView">
      <div class="listHeader racksHeader">
        <button class="back" id="racksBackBtn">← VOLVER</button>
        <div>
          <h2>RACKS</h2>
          <p id="rackSubtitle">Seleccione un rack para ver su imagen</p>
        </div>
      </div>

      <div class="rackWorkspace">
        <div class="rackButtons" id="rackButtons"></div>
        <div class="rackPreview">
          <div class="rackPreviewHeader">
            <div>
              <h3 id="selectedRackTitle">Seleccione un rack</h3>
              <p id="selectedRackLocation">—</p>
            </div>
          </div>
          <div class="rackImageFrame" id="rackImageFrame">
            <div class="rackImagePlaceholder" id="rackImagePlaceholder">Seleccione un rack para mostrar su imagen</div>
            <img id="rackImage" class="rackImage" alt="Imagen del rack" title="Clic para abrir la imagen con el visor predeterminado de Windows" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
